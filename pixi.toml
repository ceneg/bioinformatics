[workspace]
name = "vaje"
version = "2026.1.0"
description = "Practical Genomics Workflows — Undergraduate Course Environment"
channels = ["https://packages.qiime2.org/qiime2/2026.4/qiime2/released", "conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64"]

[dependencies]
python = "3.11.*"

# --- SESSION 1: De Novo Assembly & Gene Prediction ---
[feature.genomika.dependencies]
fastp = "*"
spades = "3.15.*"
quast = "*"
# Keep augustus at a build compiled WITHOUT AVX2. Bioconda build pl5321h9716f88_9
# is vectorised with AVX2 (281 AVX2 instructions, 1912 ymm registers) and dies with
# "Illegal instruction (core dumped)" on any CPU older than Haswell/Zen -- seen on an
# Ubuntu 20.04 lab machine on 2026-09-03. Build _10 has none and is what pixi.lock
# pins. Predictions are identical (87 genes / 93 CDS, asserted by the extended test).
# After any `pixi update`, re-check with:
#   objdump -d .pixi/envs/genomika/bin/augustus | grep -c '%ymm'      # must be 0
augustus = "3.5.*"
biopython = "1.83.*"

# --- SESSION 2: Transcript Quantification & DGE ---
[feature.transkriptomika.dependencies]
salmon = "1.10.*"
# Required by the bioconductor-genomeinfodbdata post-link script: it calls `yq`,
# which shells out to `jq`. `yq` ships with the data package but `jq` does not, so
# without this the script fails on any machine that has no system-wide jq and
# GenomeInfoDbData is never installed — which breaks `library(DESeq2)`.
jq = "*"
r-base = "4.3.*"
bioconductor-tximport = "1.28.*"
bioconductor-deseq2 = "1.40.*"
bioconductor-biocparallel = "*"
bioconductor-genomeinfodbdata = "*"
r-ggplot2 = "3.4.*"
r-pheatmap = "1.0.*"
r-readr = "*"
r-dplyr = "*"

# --- SESSION 3: Read Mapping & Variant Calling ---
[feature.polimorfizmi1.dependencies]
bwa = "0.7.*"
samtools = "1.19.*"
bcftools = "1.19.*"
vcftools = "*"

# --- SESSION 4: Population Genetics ---
[feature.polimorfizmi2.dependencies]
r-base = "4.3.*"
r-vcfr = "1.15.*"
r-poppr = "2.9.*"
r-ggplot2 = "3.4.*"
r-adegenet = "2.1.*"
r-hierfstat = "*"
r-ape = "5.7.*"

# --- SESSION 5: 16S Amplicon & Microbiome Diversity ---
# Session 5 runs entirely inside the isolated `qiime2` environment.
[feature.qiime2.dependencies]
python = "3.12.*"
qiime2 = "*"
q2cli = "*"
q2-types = "*"
q2-demux = "*"
q2-diversity = "*"
q2-feature-classifier = "*"
q2-taxa = "*"
q2-alignment = "*"
q2-phylogeny = "*"
q2-dada2 = "*"
biopython = "*"

[environments]
genomika = ["genomika"]
transkriptomika = ["transkriptomika"]
polimorfizmi = ["polimorfizmi1", "polimorfizmi2"]
qiime2 = { features = ["qiime2"], no-default-feature = true }

[tasks]
test = "bash tests/test_env.sh"
test-extended = "bash tests/test_extended.sh"
